server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # The browser calls /api on this server; nginx forwards it to the backend
    # container, so the frontend needs no backend URL and no CORS setup.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_read_timeout 300s;   # a batch of reviews on a CPU takes a while
        client_max_body_size 2m;
    }

    # React Router: every other path is the single-page app.
    location / {
        try_files $uri /index.html;
    }
}
